<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gelir Gider Takvimi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5f9;--sf:#fff;--tx:#0f2a3a;--mu:#6b8190;--ac:#0e7490;--ac2:#e0f1f6;--ln:#dbe6ec;--in:#1f9d62;--ex:#d8453b;--r:16px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=orman]{--bg:#eef3ee;--tx:#1a2b21;--mu:#6b8074;--ac:#2f6f4e;--ac2:#dcebe2;--ln:#d9e4dc}
:root[data-t=gunbatimi]{--bg:#fdf1ea;--tx:#3a1f14;--mu:#8a6c5e;--ac:#d9582b;--ac2:#fbe0d3;--ln:#f0dccf}
:root[data-t=mor]{--bg:#f3effa;--tx:#241a3d;--mu:#7a6f94;--ac:#6d4ac7;--ac2:#e6def7;--ln:#e0d9ef}
:root[data-t=gece]{--bg:#12151c;--sf:#1b1f2a;--tx:#e8eaf0;--mu:#8b93a7;--ac:#7aa2ff;--ac2:#26304a;--ln:#2a3040;--in:#3ec988;--ex:#ff6b61}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:880px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0;font-weight:700}
.ib{width:40px;height:40px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);font-size:18px}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.nav h2{margin:0;font-size:18px;font-weight:700}
.nav div{display:flex;gap:6px}
.nb{padding:8px 12px;border-radius:10px;background:var(--sf);border:1px solid var(--ln);font-weight:600;font-size:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px}
.sum small{color:var(--mu);font-size:12px;display:block;margin-bottom:4px}
.sum b{font-size:15px;word-break:break-word}
.in{color:var(--in)}.ex{color:var(--ex)}
.cal{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:10px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--mu);padding:4px 0;font-weight:600}
.d{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:500;font-size:15px}
.d:hover{background:var(--ac2)}
.d.o{color:var(--mu);opacity:.45}
.d.t{box-shadow:inset 0 0 0 2px var(--ac);font-weight:700}
.cal.wk .d{aspect-ratio:auto;min-height:92px;font-size:20px}
.cal.wk .wd{font-size:13px}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.dots .i{background:var(--in)}.dots .e{background:var(--ex)}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mm h3{margin:0 0 4px;font-size:14px;text-align:left;width:100%;padding:4px 6px;border-radius:8px;font-weight:700}
.mm h3:hover{background:var(--ac2)}
.mm .d{font-size:11px;border-radius:8px;gap:1px}
.mm .dots i{width:4px;height:4px}.mm .dots{height:4px;gap:2px}
.mm .wd{font-size:10px}
.lst{margin-top:14px}
.lst h3{font-size:14px;color:var(--mu);margin:14px 0 6px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:6px}
.row .dt{width:8px;height:8px;border-radius:50%;flex:none}
.row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{flex:none}
.emp{color:var(--mu);text-align:center;padding:24px 0;font-size:14px}
dialog{border:0;border-radius:20px;padding:0;background:var(--sf);color:var(--tx);width:min(460px,calc(100% - 24px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dg{padding:18px}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dh h2{margin:0;font-size:17px}
.f{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln)}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg)}
.pri{background:var(--ac);color:#fff;padding:12px;border-radius:12px;font-weight:700}
.sec{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);font-weight:600}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.sm{padding:6px 10px;font-size:13px;border-radius:8px;background:var(--bg);border:1px solid var(--ln)}
.sm.x{color:var(--ex)}
.act{display:flex;gap:6px;flex:none}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--tx)}
label.l{font-size:13px;color:var(--mu);font-weight:600;display:block;margin:12px 0 6px}
textarea.inp{height:90px;resize:vertical;font-size:12px}
.note{font-size:12px;color:var(--mu);margin:6px 0 0}
@media(max-width:480px){.sum b{font-size:13px}.d{font-size:14px}}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:p .18s ease-out}@keyframes p{from{transform:translateY(12px);opacity:0}}}
</style>
</head>
<body>
<div class="w">
  <div class="top"><h1>Gelir Gider Takvimi</h1><button class="ib" id="gear" aria-label="Ayarlar">⚙</button></div>
  <div class="seg" id="seg"><button data-v="week">Haftalık</button><button data-v="month">Aylık</button><button data-v="year">Yıllık</button></div>
  <div class="nav"><h2 id="ttl"></h2><div><button class="nb" id="prev" aria-label="Önceki">‹</button><button class="nb" id="today">Bugün</button><button class="nb" id="next" aria-label="Sonraki">›</button></div></div>
  <div class="sum"><div><small>Gelir</small><b class="in" id="si"></b></div><div><small>Gider</small><b class="ex" id="se"></b></div><div><small>Net</small><b id="sn"></b></div></div>
  <div id="cal"></div>
  <div class="lst" id="lst"></div>
</div>

<dialog id="dd"><div class="dg">
  <div class="dh"><h2 id="dtt"></h2><button class="ib" data-close aria-label="Kapat">✕</button></div>
  <div id="dl"></div>
  <div class="f">
    <div class="seg" id="tp"><button data-k="ex" class="on">Gider</button><button data-k="in">Gelir</button></div>
    <input class="inp" id="am" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Tutar">
    <input class="inp" id="nt" type="text" placeholder="Açıklama (ör. market alışverişi)">
    <div class="btns"><button class="pri" id="sv">Kaydet</button><button class="sec" id="cn" hidden>Vazgeç</button></div>
  </div>
</div></dialog>

<dialog id="sd"><div class="dg">
  <div class="dh"><h2>Ayarlar</h2><button class="ib" data-close aria-label="Kapat">✕</button></div>
  <label class="l">Tema</label>
  <div class="sw" id="sw"></div>
  <label class="l" for="cu">Para birimi</label>
  <select class="inp" id="cu"><option value="TRY">₺ Türk lirası</option><option value="USD">$ ABD doları</option><option value="EUR">€ Euro</option><option value="GBP">£ Sterlin</option></select>
  <label class="l" for="bk">Yedekleme</label>
  <textarea class="inp" id="bk" placeholder="Yedek metni burada görünür. İçe aktarmak için yedeği buraya yapıştır."></textarea>
  <div class="btns" style="margin-top:8px"><button class="sec" id="ex">Yedeği oluştur</button><button class="sec" id="im">İçe aktar</button></div>
  <p class="note" id="bm">Yedeği oluşturunca metni kopyalayıp bir yere kaydet. İçe aktarma, mevcut kayıtlara ekleme yapar.</p>
</div></dialog>

<script>
const $=s=>document.querySelector(s);
const MO=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const WD=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const TH=[['okyanus','#0e7490'],['orman','#2f6f4e'],['gunbatimi','#d9582b'],['mor','#6d4ac7'],['gece','#12151c']];
let data=[],set={theme:'okyanus',cur:'TRY',view:'month'},cur=new Date(),sel=null,edit=null,type='ex';
cur.setHours(0,0,0,0);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
data=ld('hk-data',[]);set={...set,...ld('hk-set',{})};
const save=()=>{sv('hk-data',data);sv('hk-set',set)};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>add(d,-((d.getDay()+6)%7));
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:set.cur}).format(n);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayS=ds(new Date());
function range(){
  if(set.view==='week'){const s=mon(cur);return[s,add(s,6)]}
  if(set.view==='month')return[new Date(cur.getFullYear(),cur.getMonth(),1),new Date(cur.getFullYear(),cur.getMonth()+1,0)];
  return[new Date(cur.getFullYear(),0,1),new Date(cur.getFullYear(),11,31)];
}
function title(s,e){
  if(set.view==='year')return''+cur.getFullYear();
  if(set.view==='month')return MO[cur.getMonth()]+' '+cur.getFullYear();
  const a=MO[s.getMonth()].slice(0,3),b=MO[e.getMonth()].slice(0,3);
  return s.getMonth()===e.getMonth()?`${s.getDate()} – ${e.getDate()} ${b} ${e.getFullYear()}`:`${s.getDate()} ${a} – ${e.getDate()} ${b} ${e.getFullYear()}`;
}
function cell(d,out){
  const k=ds(d),it=data.filter(x=>x.date===k);
  const di=it.some(x=>x.type==='in'),de=it.some(x=>x.type==='ex');
  return `<button class="d${out?' o':''}${k===todayS?' t':''}" data-d="${k}" aria-label="${d.getDate()} ${MO[d.getMonth()]}"><span>${d.getDate()}</span><span class="dots">${di?'<i class="i"></i>':''}${de?'<i class="e"></i>':''}</span></button>`;
}
function grid(first,count,month){
  let h='<div class="g">'+WD.map(w=>`<div class="wd">${w}</div>`).join('')+'</div><div class="g">';
  for(let i=0;i<count;i++){const d=add(first,i);h+=cell(d,month!==null&&d.getMonth()!==month)}
  return h+'</div>';
}
function render(){
  document.documentElement.dataset.t=set.theme;
  const[s,e]=range(),ss=ds(s),es=ds(e);
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===set.view));
  $('#ttl').textContent=title(s,e);
  const per=data.filter(x=>x.date>=ss&&x.date<=es);
  const inc=per.filter(x=>x.type==='in').reduce((a,x)=>a+x.amount,0),exp=per.filter(x=>x.type==='ex').reduce((a,x)=>a+x.amount,0),net=inc-exp;
  $('#si').textContent=money(inc);$('#se').textContent=money(exp);
  $('#sn').textContent=(net>0?'+':'')+money(net);$('#sn').className=net>0?'in':net<0?'ex':'';
  let h;
  if(set.view==='week')h=`<div class="cal wk">${grid(s,7,null)}</div>`;
  else if(set.view==='month'){const f=mon(s);const n=Math.ceil(((s.getDay()+6)%7+e.getDate())/7)*7;h=`<div class="cal">${grid(f,n,cur.getMonth())}</div>`}
  else{h='<div class="yr">';for(let m=0;m<12;m++){const f=new Date(cur.getFullYear(),m,1),last=new Date(cur.getFullYear(),m+1,0);const n=Math.ceil(((f.getDay()+6)%7+last.getDate())/7)*7;h+=`<div class="cal mm"><h3 data-m="${m}" role="button" tabindex="0">${MO[m]}</h3>${grid(mon(f),n,m)}</div>`}h+='</div>'}
  $('#cal').innerHTML=h;
  per.sort((a,b)=>a.date<b.date?1:-1);
  let l='',last='';
  if(!per.length)l='<div class="emp">Bu dönemde kayıt yok. Bir güne dokunup ekleyebilirsin.</div>';
  per.forEach(x=>{if(x.date!==last){last=x.date;const d=pd(x.date);l+=`<h3>${d.getDate()} ${MO[d.getMonth()]} ${WD[(d.getDay()+6)%7]}</h3>`}
    l+=`<button class="row" data-d="${x.date}"><i class="dt" style="background:var(--${x.type})"></i><span>${esc(x.note||(x.type==='in'?'Gelir':'Gider'))}</span><b class="${x.type}">${x.type==='in'?'+':'−'}${money(x.amount)}</b></button>`});
  $('#lst').innerHTML=per.length?'<h3 style="margin-top:0">Kayıtlar</h3>'+l:l;
}
function openDay(k){
  sel=k;edit=null;const d=pd(k);
  $('#dtt').textContent=`${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()}`;
  resetForm();drawDay();
  if(!$('#dd').open)$('#dd').showModal();
}
function drawDay(){
  const it=data.filter(x=>x.date===sel);
  $('#dl').innerHTML=it.length?it.map(x=>`<div class="row"><i class="dt" style="background:var(--${x.type})"></i><span>${esc(x.note||(x.type==='in'?'Gelir':'Gider'))}</span><b class="${x.type}">${x.type==='in'?'+':'−'}${money(x.amount)}</b><div class="act"><button class="sm" data-e="${x.id}">Düzenle</button><button class="sm x" data-x="${x.id}">Sil</button></div></div>`).join(''):'<div class="emp">Bu günde kayıt yok.</div>';
}
function setType(t){type=t;document.querySelectorAll('#tp button').forEach(b=>b.classList.toggle('on',b.dataset.k===t))}
function resetForm(){edit=null;setType('ex');$('#am').value='';$('#nt').value='';$('#sv').textContent='Kaydet';$('#cn').hidden=true}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,h3[data-m]');if(!t)return;
  if(t.dataset.d)return openDay(t.dataset.d);
  if(t.dataset.m!==undefined){cur=new Date(cur.getFullYear(),+t.dataset.m,1);set.view='month';save();return render()}
  if(t.dataset.close!==undefined)return t.closest('dialog').close();
  if(t.dataset.e){const x=data.find(y=>y.id===t.dataset.e);edit=x.id;setType(x.type);$('#am').value=x.amount;$('#nt').value=x.note;$('#sv').textContent='Güncelle';$('#cn').hidden=false;return $('#am').focus()}
  if(t.dataset.x){data=data.filter(y=>y.id!==t.dataset.x);save();if(edit===t.dataset.x)resetForm();drawDay();return render()}
  if(t.dataset.k)return setType(t.dataset.k);
  if(t.dataset.v){set.view=t.dataset.v;save();return render()}
});
$('#sv').onclick=()=>{
  const a=parseFloat(String($('#am').value).replace(',','.'));
  if(!(a>0)){$('#am').focus();$('#am').style.borderColor='var(--ex)';return}
  $('#am').style.borderColor='';
  const n=$('#nt').value.trim();
  if(edit){const x=data.find(y=>y.id===edit);x.amount=a;x.note=n;x.type=type}
  else data.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:sel,type,amount:a,note:n});
  save();resetForm();drawDay();render();
};
$('#cn').onclick=resetForm;
function step(n){
  if(set.view==='week')cur=add(cur,7*n);
  else if(set.view==='month')cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);
  else cur=new Date(cur.getFullYear()+n,cur.getMonth(),1);
  render();
}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#today').onclick=()=>{cur=new Date();cur.setHours(0,0,0,0);render()};
$('#gear').onclick=()=>{$('#cu').value=set.cur;drawSw();$('#sd').showModal()};
function drawSw(){$('#sw').innerHTML=TH.map(([k,c])=>`<button style="background:${c}" class="${set.theme===k?'on':''}" data-th="${k}" aria-label="${k}"></button>`).join('')}
$('#sw').onclick=e=>{const b=e.target.closest('[data-th]');if(!b)return;set.theme=b.dataset.th;save();drawSw();render()};
$('#cu').onchange=e=>{set.cur=e.target.value;save();render();if($('#dd').open)drawDay()};
$('#ex').onclick=async()=>{
  const t=JSON.stringify({v:1,data});$('#bk').value=t;$('#bk').select();
  let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  $('#bm').textContent=ok?'Yedek kopyalandı. Bir notlar uygulamasına yapıştırıp sakla.':'Metni seçip kopyala ve bir yere kaydet.';
};
$('#im').onclick=()=>{
  try{
    const o=JSON.parse($('#bk').value);const arr=Array.isArray(o)?o:o.data;
    if(!Array.isArray(arr))throw 0;
    const ids=new Set(data.map(x=>x.id));let n=0;
    arr.forEach(x=>{if(x&&x.id&&x.date&&x.amount>0&&(x.type==='in'||x.type==='ex')&&!ids.has(x.id)){data.push({id:String(x.id),date:String(x.date),type:x.type,amount:+x.amount,note:String(x.note||'')});n++}});
    save();render();$('#bm').textContent=n+' kayıt eklendi.';
  }catch(e){$('#bm').textContent='Metin okunamadı. Yedeği eksiksiz yapıştırdığından emin ol.'}
};
render();
</script>
</body>
</html>
